name: ShapeMapper2 public candidate validation

on:
  pull_request:
    paths:
      - .github/workflows/shapemapper2-container-poc.yml
      - containers/shapemapper2/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out NERD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build amd64 image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: containers/shapemapper2
          platforms: linux/amd64
          load: true
          push: false
          tags: nerd-shapemapper2:2.3-public-candidate

      - name: Run upstream example smoke test
        run: containers/shapemapper2/test-container.sh nerd-shapemapper2:2.3-public-candidate

      - name: Run complete upstream test suite
        run: containers/shapemapper2/test-upstream.sh nerd-shapemapper2:2.3-public-candidate

      - name: Capture exact Debian binary and source package inventory
        run: |
          docker run --rm --entrypoint dpkg-query \
            nerd-shapemapper2:2.3-public-candidate \
            -W '-f=${binary:Package}\t${Version}\t${source:Package}\t${source:Version}\n' \
            | LC_ALL=C sort > shapemapper2-2.3-r0.debian-packages.tsv

      - name: Upload Debian package inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shapemapper2-2.3-r0-debian-packages
          path: shapemapper2-2.3-r0.debian-packages.tsv
          retention-days: 30
          if-no-files-found: error

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: nerd-shapemapper2:2.3-public-candidate
          format: spdx-json
          output-file: shapemapper2-2.3-r0.spdx.json
          artifact-name: shapemapper2-2.3-r0.spdx.json
          upload-artifact-retention: 30
          upload-release-assets: false
